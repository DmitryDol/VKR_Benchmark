[project]
name = "vkr-claude"
version = "0.1.0"
description = "Transformer-based Object Detection Benchmarking System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "onnx>=1.17.0",
    "onnxruntime-gpu>=1.22.0",
    "pycocotools>=2.0.11",
    "Pillow>=11.0.0",
    "numpy>=2.0.0",
    "typer>=0.15.0",
    "onnxsim>=0.4.36",
    "transformers[torch]>=5.8.0",
]

[project.optional-dependencies]
tensorrt = [
    "tensorrt>=10.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific
    "S",      # flake8-bandit (security)
    "PT",     # flake8-pytest-style
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any)
    "S101",    # use of assert (ok in tests)
    "T201",    # print found (allow in scripts)
    "PLR0913", # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
