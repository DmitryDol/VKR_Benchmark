[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[project]
name = "vkr-claude"
version = "0.1.0"
description = "Transformer-based Object Detection Benchmarking System"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "onnx>=1.17.0",
    "onnxruntime-gpu>=1.22.0",
    "pycocotools>=2.0.11",
    "Pillow>=11.0.0",
    "numpy>=2.0.0",
    "typer>=0.15.0",
    "onnxsim>=0.4.36",
    "transformers[torch]>=5.8.0",
    "onnxscript>=0.7.0",
    "fvcore>=0.1.5.post20221221",
    "calflops>=0.3.2",
    "ultralytics>=8.4.48",
    "rfdetr>=1.6.5.post0",
    "supervision>=0.27.0.post2",
    "roboflow>=1.3.8",
    "coloredlogs>=15.0.1",
    "flatbuffers>=25.12.19",
    "packaging>=26.2",
    "protobuf>=7.34.1",
    "sympy>=1.14.0",
    # CUDA 12 runtime libs for onnxruntime-gpu's CUDA EP. ORT 1.26 is built
    # against CUDA 12.x; the project's torch ships CUDA 13.x, so ORT cannot
    # reuse torch's bundled libs. These provide cudart/cuDNN/cuBLAS 12.x.
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cudnn-cu12>=9.22.0.52",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cufft-cu12>=11.4.1.4",
]

[project.scripts]
benchmark = "benchmark.cli:app"

[project.optional-dependencies]
tensorrt = [
    "tensorrt>=10.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific
    "S",      # flake8-bandit (security)
    "PT",     # flake8-pytest-style
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any)
    "S101",    # use of assert (ok in tests)
    "T201",    # print found (allow in scripts)
    "PLR0913", # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
